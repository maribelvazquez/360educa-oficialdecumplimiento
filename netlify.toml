# Herramientas del curso Oficial de Cumplimiento · GMC360 · 360Educa
# Se incrustan dentro de Thinkific (360educa.com).
# frame-ancestors autoriza SOLO a esos dominios a mostrarlas en un marco.

[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "frame-ancestors 'self' https://360educa.com https://*.360educa.com https://*.thinkific.com"

# El HTML no se guarda en caché: si no, después de cada actualización el
# navegador sigue sirviendo la versión anterior y parece que nada cambió.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/estilo.css"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/datos/*"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
